org.gradle.caching=true
group=io.ballerina.lib
version=1.0.0-SNAPSHOT

releasePluginVersion=2.8.0
ballerinaGradlePluginVersion=2.3.0
ballerinaLangVersion=2201.12.0

# Text-extraction stack. Versions are pinned here and templated into the two
# Ballerina.toml files (see build-config/resources/Ballerina.toml + ballerina/build.gradle).
# The set mirrors `ballerina/ai`'s own PDF + OOXML (docx/pptx) extraction dependencies so
# the supported file types match exactly.
tikaVersion=3.2.2
pdfboxVersion=3.0.5
pdfboxIoVersion=3.0.5
jempboxVersion=1.8.17
poiVersion=5.4.1
commonsIoVersion=2.20.0
# Deliberately below ballerina/ai's 1.28.0: see the note in build-config/resources/Ballerina.toml
# (1.28.0 requires commons-lang3 >= 3.17.0, but ballerina-rt bundles a shaded 3.14.0 that wins).
commonsCompressVersion=1.27.1
commonsCollections4Version=4.4
log4jVersion=2.25.4
xmlbeansVersion=5.3.0
sparseBitSetVersion=1.3
